name: Validate

on:
  # No `labeled`/`unlabeled`: nothing in this workflow reads labels. The PR scope gate,
  # which does, runs in pr-scope.yml, so applying a label no longer repeats the full
  # toolchain install and every recipe build.
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

# A newer push to the same PR supersedes the run in progress.
concurrency:
  group: validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # git-derived versions

      - uses: actions/setup-node@v5
        with:
          node-version: "20.x"
          cache: "npm"
      - run: npm ci

      - name: Install luacheck
        run: |
          sudo apt-get update
          sudo apt-get install -y luarocks
          sudo luarocks install luacheck

      - name: Lua lint
        run: luacheck filters/ writers/ --config .luacheckrc

      - name: Security scan (Lua/LaTeX high-risk APIs)
        run: node scripts/scan-security.mjs

      - name: Validate invariants + index (strict)
        run: node scripts/validate.mjs

      - name: Asset / recipe / bundle versions are semver
        run: node scripts/check-versions.mjs

      # Needs no pandoc: the masters are patched from the vendored base in
      # scripts/reference-base/, so a pandoc bump cannot turn this step red.
      - name: Reference masters match their generators
        run: |
          node scripts/mk-manuscript-reference.mjs --check
          node scripts/mk-response-letter-reference.mjs --check

      - name: Install pandoc + pandoc-crossref
        run: bash .github/scripts/install-pandoc.sh

      - name: Build-test recipes (fingerprint smoke + golden)
        run: node scripts/build-recipe.mjs --all
