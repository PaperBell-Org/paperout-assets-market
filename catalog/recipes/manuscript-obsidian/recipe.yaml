description:
  en: "Manuscript to Word (.docx) in English-journal layout: Times New Roman 12 pt,
    double-spaced and justified, centred title, line numbers running continuously
    across pages, title/author/affiliation/abstract block, cross-references and
    citations. Figures and tables can optionally be moved to the end."
  zh: 手稿导出英文期刊投稿版式的 Word（.docx）：Times New Roman 12pt、双倍行距、正文两端对齐、标题居中、行号跨页连续、标题/作者/机构/摘要抬头、交叉引用与文献；图表可选后置。
